name: ci

# Thin caller: the logic lives in the factory, at the release pinned below.
#
# The pin is the point. This repository keeps running that exact release until
# somebody bumps the line and merges it - a new release in the factory changes
# nothing here on its own. `/update-agents` proposes the bump as a pull
# request, so the diff gets read here before it runs here.
#
# ---------------------------------------------------------------------------
# This gate is real. It ran as a placeholder until the stack was chosen, and was
# replaced on the pull request that landed the first product code, onto that
# pull request's branch rather than the default branch - so the commands ran
# against the code that needs them and `main` stayed green throughout.
#
# `check-name` stays `checks` and that is deliberate: the job name is the string
# branch protection matches on, so a gate that renames itself when it grows up
# forces the rule to be re-pointed - and until somebody does, the required check
# no longer reports and every merge is blocked, including the pull request that
# would fix it. One stable name means protection is set once, at provisioning,
# and never touched again. What the gate runs is in the run summary, where it
# can change as often as it likes.
#
# The commands below must stay in step with CLAUDE.md's Commands section. If a
# check is renamed in one, rename it in the other in the same commit, or the
# gate silently stops checking that thing.
#
# Why uv arrives the long way round, rather than as a tidier-looking bare `uv`.
# Three constraints, and every shorter spelling breaks one of them:
#
#   - The reusable workflow runs each line below in its own
#     `bash -euo pipefail -c`, so a PATH export on one line never reaches the
#     next, and $GITHUB_PATH only affects later steps, not later lines of one
#     step. Hence absolute paths.
#   - The runner ships no uv of its own, and a bare `pip install` is not
#     dependable where the system Python is externally managed (PEP 668).
#     Hence a throwaway venv, which is exempt from that.
#   - uv's own `curl | sh` installer would add a new outbound host and a remote
#     script source to this gate. PyPI is already a destination this project
#     resolves from, so uv is fetched from there and nowhere new. A gate that
#     executes an unpinned remote script is a gate the gated party could be
#     served a different version of.
#
# This is load-bearing, not clutter.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: chamaya00/agent-factory/.github/workflows/ci.yml@v1.36.0
    with:
      check-name: 'checks'
      commands: |
        python3 -m venv /tmp/uvbin && /tmp/uvbin/bin/pip install --quiet uv
        /tmp/uvbin/bin/uv sync
        /tmp/uvbin/bin/uv run ruff check .
        /tmp/uvbin/bin/uv run pytest
